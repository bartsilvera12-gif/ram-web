<script src="config.js"></script>
<script>
(function () {
  // Trae el contenido editable desde Supabase y lo deja en window.RAM_DATOS.
  // Si no hay configuracion, o la consulta falla, el sitio sigue mostrando el
  // contenido que trae escrito: nunca queda en blanco por culpa de la base.
  var C = window.RAM_CONFIG;
  if (!C || !C.SUPABASE_URL || /TU-SUPABASE|TU_ANON_KEY/.test(C.SUPABASE_URL + C.SUPABASE_ANON_KEY)) return;

  var base = String(C.SUPABASE_URL).replace(/\/+$/, '') + '/rest/v1/';
  var cabeceras = {
    apikey: C.SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY,
    'Accept-Profile': C.SCHEMA || 'ram'
  };

  function tabla(nombre, consulta) {
    return fetch(base + nombre + consulta, { headers: cabeceras })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
  }

  var activos = '?select=*&activo=is.true&order=orden.asc';
  Promise.all([
    tabla('disciplinas', activos),
    tabla('horarios', activos),
    tabla('galeria', activos),
    tabla('beneficios', activos),
    tabla('instructores', activos),
    tabla('ajustes', '?select=*'),
    tabla('disciplina_instructores', '?select=*&order=orden.asc'),
    tabla('eventos', '?select=*&activo=is.true&order=fecha.asc.nullslast,orden.asc')
  ]).then(function (r) {
    var aj = {};
    (r[5] || []).forEach(function (a) { aj[a.clave] = a.valor; });
    window.RAM_DATOS = {
      disciplinas: r[0] || [], horarios: r[1] || [], galeria: r[2] || [],
      beneficios: r[3] || [], instructores: r[4] || [], ajustes: aj,
      vinculos: r[6] || [], eventos: r[7] || []
    };
    window.dispatchEvent(new CustomEvent('ram:datos'));
  });
})();
</script>

<script>
(function () {
  var MOBILE = 860;
  var root = document.documentElement;

  function setHeaderHeight() {
    var h = document.getElementById('ram-header');
    if (h) root.style.setProperty('--ram-header-h', h.offsetHeight + 'px');
  }
  function close() {
    root.classList.remove('ram-menu-open');
    var b = document.getElementById('ram-menu-btn');
    if (b) b.setAttribute('aria-expanded', 'false');
  }

  // Delegado en document: sobrevive a los re-render del runtime.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#ram-menu-btn');
    if (btn) {
      setHeaderHeight();
      var open = root.classList.toggle('ram-menu-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    if (e.target.closest && e.target.closest('#ram-nav a')) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });

  window.addEventListener('resize', function () {
    setHeaderHeight();
    if (window.innerWidth > MOBILE) close();
  });

  window.addEventListener('load', setHeaderHeight);
  setTimeout(setHeaderHeight, 300);
})();
</script>
<script>
(function () {
  // Disciplinas: carrusel horizontal con flechas.
  // No intercepta el scroll de la pagina: solo mueve su propio contenedor.
  // El runtime vuelve a montar el DOM, asi que todo se busca al vuelo y los
  // listeners van en document.
  function caja() {
    var t = document.querySelector('[data-ram="dx-track"]');
    if (!t) return null;
    var raiz = t.closest('[data-ram="dx"]') || document;
    return {
      track: t,
      barra: raiz.querySelector('[data-ram="dx-bar"]'),
      prev: raiz.querySelector('[data-ram="dx-prev"]'),
      next: raiz.querySelector('[data-ram="dx-next"]')
    };
  }

  function refrescar() {
    var c = caja();
    if (!c) return;
    var max = c.track.scrollWidth - c.track.clientWidth;
    var x = c.track.scrollLeft;
    var p = max > 2 ? x / max : 0;
    if (c.barra) c.barra.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    // Se atenuan en los extremos, pero nunca se deshabilitan: un boton
    // disabled no dispara click, y si el estado quedara viejo la navegacion
    // se bloquearia sin forma de recuperarla.
    if (c.prev) c.prev.setAttribute('data-tope', (max <= 2 || x <= 2) ? 'si' : 'no');
    if (c.next) c.next.setAttribute('data-tope', (max <= 2 || x >= max - 2) ? 'si' : 'no');
  }

  function mover(sentido) {
    var c = caja();
    if (!c) return;
    var tarjeta = c.track.querySelector('button');
    var paso = tarjeta
      ? tarjeta.getBoundingClientRect().width + 20
      : c.track.clientWidth * 0.8;
    c.track.scrollBy({ left: sentido * paso, behavior: 'smooth' });
    // El evento scroll del contenedor puede no llegar (pestana en segundo
    // plano, por ejemplo): se refresca igual, durante y al final del recorrido.
    refrescar();
    setTimeout(refrescar, 260);
    setTimeout(refrescar, 650);
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-ram="dx-prev"]')) { e.preventDefault(); mover(-1); }
    else if (e.target.closest('[data-ram="dx-next"]')) { e.preventDefault(); mover(1); }
  });

  // El scroll de un contenedor no burbujea: hay que escucharlo en captura
  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-ram') === 'dx-track') refrescar();
  }, true);

  window.addEventListener('resize', refrescar);
  window.addEventListener('load', refrescar);

  // El runtime monta despues del load y vuelve a montar al cambiar de pagina
  var pendiente = null;
  if (window.MutationObserver) {
    new MutationObserver(function () {
      if (pendiente) return;
      pendiente = setTimeout(function () { pendiente = null; refrescar(); }, 120);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
