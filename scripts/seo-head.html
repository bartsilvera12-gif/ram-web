<script src="config.js"></script>
<script>
(function () {
  // Trae el contenido editable desde Supabase y lo deja en window.RAM_DATOS.
  // Si no hay configuracion, o la consulta falla, el sitio sigue mostrando el
  // contenido que trae escrito: nunca queda en blanco por culpa de la base.
  var C = window.RAM_CONFIG;
  if (!C || !C.SUPABASE_URL || /TU-SUPABASE|TU_ANON_KEY/.test(C.SUPABASE_URL + C.SUPABASE_ANON_KEY)) return;

  var base = String(C.SUPABASE_URL).replace(/\/+$/, '') + '/rest/v1/';
  var cabeceras = {
    apikey: C.SUPABASE_ANON_KEY,
    Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY,
    'Accept-Profile': C.SCHEMA || 'ram'
  };

  function tabla(nombre, consulta) {
    return fetch(base + nombre + consulta, { headers: cabeceras })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
  }

  var activos = '?select=*&activo=is.true&order=orden.asc';
  Promise.all([
    tabla('disciplinas', activos),
    tabla('horarios', activos),
    tabla('galeria', activos),
    tabla('beneficios', activos),
    tabla('instructores', activos),
    tabla('ajustes', '?select=*'),
    tabla('disciplina_instructores', '?select=*&order=orden.asc')
  ]).then(function (r) {
    var aj = {};
    (r[5] || []).forEach(function (a) { aj[a.clave] = a.valor; });
    window.RAM_DATOS = {
      disciplinas: r[0] || [], horarios: r[1] || [], galeria: r[2] || [],
      beneficios: r[3] || [], instructores: r[4] || [], ajustes: aj,
      vinculos: r[6] || []
    };
    window.dispatchEvent(new CustomEvent('ram:datos'));
  });
})();
</script>

<script>
(function () {
  var MOBILE = 860;
  var root = document.documentElement;

  function setHeaderHeight() {
    var h = document.getElementById('ram-header');
    if (h) root.style.setProperty('--ram-header-h', h.offsetHeight + 'px');
  }
  function close() {
    root.classList.remove('ram-menu-open');
    var b = document.getElementById('ram-menu-btn');
    if (b) b.setAttribute('aria-expanded', 'false');
  }

  // Delegado en document: sobrevive a los re-render del runtime.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#ram-menu-btn');
    if (btn) {
      setHeaderHeight();
      var open = root.classList.toggle('ram-menu-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    if (e.target.closest && e.target.closest('#ram-nav a')) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });

  window.addEventListener('resize', function () {
    setHeaderHeight();
    if (window.innerWidth > MOBILE) close();
  });

  window.addEventListener('load', setHeaderHeight);
  setTimeout(setHeaderHeight, 300);
})();
</script>
<script>
(function () {
  // Disciplinas: convierte el scroll vertical sobre la seccion en
  // desplazamiento horizontal del track.
  // El runtime vuelve a montar el DOM, asi que no se cachea nada en los
  // nodos (se perderia): todo se recalcula por frame, que es barato.
  var MOBILE = 860;
  var raf = null;

  function pintar() {
    raf = null;
    var wrap = document.querySelector('[data-ram="dx"]');
    if (!wrap) return;
    var track = wrap.querySelector('[data-ram="dx-track"]');
    var sticky = wrap.querySelector('[data-ram="dx-sticky"]');
    if (!track || !sticky) return;

    if (window.innerWidth <= MOBILE) {
      if (wrap.style.height) wrap.style.height = '';
      if (track.style.transform) track.style.transform = '';
      return;
    }

    var recorrido = track.scrollWidth - sticky.clientWidth;
    if (recorrido < 0) recorrido = 0;

    // alto = una pantalla pegada + lo que falte recorrer de costado
    var alto = (window.innerHeight + recorrido) + 'px';
    if (wrap.style.height !== alto) wrap.style.height = alto;
    if (!recorrido) return;

    var total = wrap.offsetHeight - window.innerHeight;
    var p = total > 0 ? (-wrap.getBoundingClientRect().top / total) : 0;
    p = p < 0 ? 0 : (p > 1 ? 1 : p);

    track.style.transform = 'translate3d(' + (-p * recorrido).toFixed(1) + 'px,0,0)';
    var bar = wrap.querySelector('[data-ram="dx-bar"]');
    if (bar) bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
  }

  function pedir() { if (!raf) raf = requestAnimationFrame(pintar); }

  window.addEventListener('scroll', pedir, { passive: true });
  window.addEventListener('resize', pedir);
  window.addEventListener('load', pedir);

  // El runtime compila con Babel y monta bastante despues del load, y vuelve
  // a montar al cambiar de pagina. Se observa el DOM en vez de adivinar.
  var pendiente = null;
  if (window.MutationObserver) {
    new MutationObserver(function () {
      if (pendiente) return;
      pendiente = setTimeout(function () { pendiente = null; pedir(); }, 120);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
