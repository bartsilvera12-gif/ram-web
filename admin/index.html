<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · RAM Martial Arts</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #F10600;
    --rojo-hover: #A30000;
    --negro: #0A0A0A;
    --panel: #141414;
    --panel-2: #1C1C1C;
    --borde: rgba(191,195,199,.18);
    --texto: #F5F5F5;
    --apagado: #BFC3C7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--negro); color: var(--texto);
    font-family: Poppins, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; font-size: 14px; }
  a { color: var(--rojo); }

  /* ---------- barra de desplazamiento ---------- */
  * { scrollbar-width: thin; scrollbar-color: #3A3A3A transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--negro); }
  ::-webkit-scrollbar-thumb {
    background: #333; border: 3px solid var(--negro); border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--rojo); }
  ::-webkit-scrollbar-corner { background: var(--negro); }

  /* ---------- casillas ---------- */
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 19px; height: 19px; flex: 0 0 auto; margin: 0;
    background: var(--negro); border: 1px solid #3A3A3A;
    display: inline-grid; place-content: center; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  input[type=checkbox]::before {
    content: ''; width: 10px; height: 10px; transform: scale(0);
    transition: transform .15s cubic-bezier(.2,.8,.3,1.2);
    background: #fff;
    clip-path: polygon(14% 44%, 0 65%, 42% 100%, 100% 22%, 83% 6%, 40% 65%);
  }
  input[type=checkbox]:checked { background: var(--rojo); border-color: var(--rojo); }
  input[type=checkbox]:checked::before { transform: scale(1); }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
  input[type=checkbox]:hover:not(:checked) { border-color: var(--apagado); }

  /* ---------- selectores ---------- */
  select {
    appearance: none; -webkit-appearance: none;
    padding-right: 38px; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BFC3C7' stroke-width='2'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 15px;
  }
  select:hover { background-color: #1A1A1A; }
  /* El desplegable nativo lo pinta el sistema: al menos que no quede blanco */
  select option { background: var(--panel); color: var(--texto); }

  /* ---------- estructura ---------- */
  .cargando {
    position: fixed; inset: 0; display: grid; place-content: center;
    background: var(--negro); z-index: 500; gap: 14px; text-align: center;
  }
  .oculto { display: none !important; }

  header.barra {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--borde);
  }
  .marca { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.01em; }
  .marca span { color: var(--rojo); }

  nav.tabs {
    display: flex; gap: 4px; padding: 0 14px; background: var(--panel);
    border-bottom: 1px solid var(--borde); overflow-x: auto;
    position: sticky; top: 61px; z-index: 40;
  }
  nav.tabs button {
    background: none; border: none; color: var(--apagado); cursor: pointer;
    padding: 14px 16px; font-weight: 600; font-size: 12px; letter-spacing: .1em;
    text-transform: uppercase; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  nav.tabs button:hover { color: var(--texto); }
  nav.tabs button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--rojo); }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 22px 120px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; text-transform: uppercase; letter-spacing: -.02em; }
  .sub { color: var(--apagado); font-size: 14px; margin: 0 0 26px; line-height: 1.55; }

  /* ---------- tarjetas y formularios ---------- */
  .ficha {
    background: var(--panel); border: 1px solid var(--borde);
    padding: 20px; margin-bottom: 16px;
  }
  .ficha-cab {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 4px; cursor: pointer;
  }
  .ficha-titulo { font-weight: 700; font-size: 16px; }
  .ficha-meta { color: var(--apagado); font-size: 12px; font-family: 'JetBrains Mono', monospace; }

  label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
          color: var(--apagado); margin: 16px 0 7px; font-family: 'JetBrains Mono', monospace; }
  input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
    width: 100%; border: 1px solid var(--borde);
    color: var(--texto); padding: 11px 13px; border-radius: 0;
    /* background-color y no el atajo: el atajo borraría la flecha del select */
    background-color: var(--negro);
    transition: border-color .15s ease;
  }
  input[type=text]:hover, input[type=email]:hover, input[type=password]:hover,
  input[type=number]:hover, textarea:hover { border-color: #3A3A3A; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--rojo); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .ayuda { font-size: 12px; color: var(--apagado); margin-top: 6px; line-height: 1.5; }

  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 16px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    padding: 12px 20px; background: var(--rojo); color: #fff; border: none;
    font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer;
  }
  .btn:hover { background: var(--rojo-hover); }
  .btn[disabled] { opacity: .5; cursor: progress; }
  .btn.fantasma { background: transparent; border: 1px solid var(--borde); color: var(--texto); }
  .btn.fantasma:hover { border-color: var(--texto); background: rgba(245,245,245,.06); }
  .btn.peligro { background: transparent; border: 1px solid rgba(241,6,0,.5); color: var(--rojo); }
  .btn.peligro:hover { background: rgba(241,6,0,.12); }
  .btn.chico { padding: 8px 13px; font-size: 11px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

  /* ---------- imágenes ---------- */
  .img-campo { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .img-previa {
    width: 128px; height: 128px; object-fit: cover; background: var(--panel-2);
    border: 1px solid var(--borde); flex: 0 0 auto;
  }
  .img-controles { flex: 1 1 240px; min-width: 0; }

  /* ---------- login ---------- */
  .login {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  /* Foto del tatami de fondo, bien apagada para que el formulario mande */
  .login-fondo {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(180deg, rgba(10,10,10,.88), rgba(10,10,10,.97)),
      url('../uploads/_MG_7132%20(1).JPG.jpeg');
    background-size: cover;
    background-position: center;
    filter: grayscale(.75) brightness(.55);
  }
  /* Resplandor rojo apenas perceptible detrás de la tarjeta */
  .login-fondo::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(60% 50% at 50% 45%, rgba(241,6,0,.16), transparent 70%);
  }

  .login-caja {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: #141414;
    border: 1px solid var(--borde);
    padding: 38px 34px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.8);
    animation: entrar .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes entrar {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  /* Filo rojo arriba, como el resto del sitio */
  .login-caja::before {
    content: ''; position: absolute; top: -1px; left: -1px; right: -1px;
    height: 3px; background: var(--rojo);
  }

  .login-logo {
    height: 54px; width: auto; display: block;
    margin: 0 auto 22px; mix-blend-mode: screen;
  }
  .login-titulo {
    margin: 0 0 8px; text-align: center;
    font-size: 19px; font-weight: 800; letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .login-bajada {
    margin: 0 0 24px; text-align: center;
    font-size: 13px; line-height: 1.6; color: var(--apagado);
  }

  /* campo con icono y, en la contraseña, el ojo */
  .campo { position: relative; display: flex; align-items: center; }
  .campo input { padding-left: 42px; padding-top: 13px; padding-bottom: 13px; }
  .campo input::placeholder { color: #5A5F63; }
  .campo-icono {
    position: absolute; left: 13px; width: 18px; height: 18px;
    color: var(--apagado); pointer-events: none;
  }
  .campo:focus-within .campo-icono { color: var(--rojo); }

  .campo-ojo {
    position: absolute; right: 4px;
    width: 38px; height: 38px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; color: var(--apagado);
  }
  .campo-ojo:hover { color: var(--texto); }
  .campo-ojo svg { width: 19px; height: 19px; }
  .campo-ojo .ojo-cerrado { display: none; }
  .campo-ojo[aria-pressed="true"] .ojo-abierto { display: none; }
  .campo-ojo[aria-pressed="true"] .ojo-cerrado { display: block; }
  .campo-ojo[aria-pressed="true"] { color: var(--rojo); }

  .login-error {
    background: rgba(241,6,0,.1);
    border-left: 3px solid var(--rojo);
    padding: 12px 14px; margin-bottom: 20px;
    font-size: 13px; line-height: 1.5;
  }
  .login-volver {
    display: block; text-align: center; margin-top: 22px;
    font-size: 12px; color: var(--apagado); text-decoration: none;
    letter-spacing: .04em;
  }
  .login-volver:hover { color: var(--texto); }

  @media (max-width: 420px) {
    .login { padding: 16px; }
    .login-caja { padding: 30px 22px 24px; }
  }

  /* ---------- avisos ---------- */
  #avisos { position: fixed; right: 18px; bottom: 18px; z-index: 300;
            display: flex; flex-direction: column; gap: 10px; max-width: min(420px, calc(100vw - 36px)); }
  .aviso {
    background: var(--panel-2); border-left: 3px solid var(--rojo);
    padding: 13px 16px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
  }
  .aviso.ok { border-left-color: #22C55E; }
  /* ---------- listado ---------- */
  .barra-acciones {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); border: 1px solid var(--borde);
    padding: 14px 16px; transition: border-color .18s ease, background .18s ease;
  }
  .item:hover { border-color: #3A3A3A; background: var(--panel-2); }
  .item.inactivo { opacity: .55; }
  .item-img {
    width: 56px; height: 56px; object-fit: cover; flex: 0 0 auto;
    background: var(--panel-2); border: 1px solid var(--borde);
  }
  .item-txt { flex: 1 1 auto; min-width: 0; }
  .item-nombre {
    font-weight: 700; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--apagado); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-botones { display: flex; gap: 8px; flex: 0 0 auto; }
  .etiqueta-oculto {
    display: inline-block; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--apagado);
    border: 1px solid var(--borde); padding: 2px 6px; margin-left: 8px;
  }

  .volver {
    background: none; border: none; color: var(--apagado); cursor: pointer;
    padding: 0; margin-bottom: 18px; font-size: 13px; display: inline-flex;
    align-items: center; gap: 7px;
  }
  .volver:hover { color: var(--texto); }

  /* ---------- modal de confirmación ---------- */
  .modal-fondo {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(5,5,5,.78); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 22px;
    animation: aparecer .18s ease both;
  }
  @keyframes aparecer { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--panel); border: 1px solid var(--borde);
    width: 100%; max-width: 420px; padding: 28px 26px 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.8);
    animation: subir .22s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes subir { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  .modal h2 {
    margin: 0 0 10px; font-size: 17px; font-weight: 800; text-transform: uppercase;
  }
  .modal p { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: var(--apagado); }
  .modal .acciones { margin: 0; justify-content: flex-end; }

  .vacio { color: var(--apagado); font-size: 14px; padding: 36px 0; text-align: center; }
  .error-arranque { max-width: 620px; margin: 12vh auto; padding: 0 22px; line-height: 1.6; }
  .error-arranque code {
    background: var(--panel); padding: 2px 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  .error-arranque pre {
    background: var(--panel); border: 1px solid var(--borde); padding: 14px;
    overflow-x: auto; font-size: 12px; font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 640px) {
    nav.tabs { top: 59px; }
    main { padding: 22px 16px 110px; }
    header.barra { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div id="cargando" class="cargando">
  <div style="font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px">RAM</div>
  <div style="color:var(--apagado);font-size:13px">Conectando…</div>
</div>

<!-- Pantalla de error cuando falta configuración -->
<div id="pantalla-error" class="error-arranque oculto"></div>

<!-- Login -->
<div id="pantalla-login" class="login oculto">
  <div class="login-fondo" aria-hidden="true"></div>
  <div class="login-caja">
    <img class="login-logo" src="../uploads/Logotipo%20RAM%20de%20artes%20marciales.png" alt="RAM Martial Arts">
    <h1 class="login-titulo">Panel de administración</h1>
    <p class="login-bajada">Entrá con la cuenta de administración para editar el contenido del sitio.</p>

    <div id="login-error" class="login-error oculto" role="alert"></div>

    <form id="form-login" novalidate>
      <label for="correo">Correo</label>
      <div class="campo">
        <svg class="campo-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
        <input id="correo" type="email" autocomplete="username" placeholder="admin@ram.com" required>
      </div>

      <label for="clave">Contraseña</label>
      <div class="campo">
        <svg class="campo-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
        </svg>
        <input id="clave" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="button" id="ver-clave" class="campo-ojo" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>
          </svg>
          <svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M2 12s3.8-6.5 10-6.5c1.6 0 3 .4 4.3 1M22 12s-3.8 6.5-10 6.5c-1.6 0-3-.4-4.3-1"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/>
          </svg>
        </button>
      </div>

      <div class="acciones">
        <button class="btn" type="submit" id="btn-entrar" style="width:100%">Entrar</button>
      </div>
    </form>
    <a class="login-volver" href="../">← Volver al sitio</a>
  </div>
</div>

<!-- Panel -->
<div id="pantalla-panel" class="oculto">
  <header class="barra">
    <div class="marca">RAM<span>.</span> Panel</div>
    <div style="display:flex;align-items:center;gap:14px">
      <span id="quien" class="ficha-meta"></span>
      <button class="btn fantasma chico" id="btn-salir">Salir</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="vista"></main>
</div>

<div id="avisos"></div>
<div id="modal"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
